# Publishes to Maven Central when a GitHub release is published.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   MAVEN_CENTRAL_USERNAME   Central Portal user token, username part
#   MAVEN_CENTRAL_PASSWORD   Central Portal user token, password part
#   SIGNING_KEY              ASCII-armored private GPG key (gpg --export-secret-keys --armor <KEYID>)
#   SIGNING_KEY_PASSWORD     passphrase of that key
#
# Optional repository variable:
#   MAVEN_CENTRAL_AUTO_RELEASE = true   release automatically after upload.
#                                       Unset or anything else: the deployment waits in the Portal for a manual Publish.
#
# Run it by hand from the Actions tab to rehearse: with "publish" unchecked it runs the tests, checks the secrets and
# signs into a local repository, but uploads nothing.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Really upload to Maven Central (leave unchecked to rehearse without uploading)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to Maven Central
    needs: verify
    # Pre-releases are never published.
    if: ${{ !(github.event_name == 'release' && github.event.release.prerelease) }}
    runs-on: ubuntu-latest
    # Optional: add required reviewers to this environment for a manual approval gate before anything is uploaded.
    environment: maven-central
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Check that all secrets are set
        run: |
          missing=0
          check() { if [ -z "$2" ]; then echo "::error::Secret $1 is not set"; missing=1; fi; }
          check MAVEN_CENTRAL_USERNAME "$ORG_GRADLE_PROJECT_mavenCentralUsername"
          check MAVEN_CENTRAL_PASSWORD "$ORG_GRADLE_PROJECT_mavenCentralPassword"
          check SIGNING_KEY "$ORG_GRADLE_PROJECT_signingInMemoryKey"
          check SIGNING_KEY_PASSWORD "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword"
          exit $missing

      - name: Check that the release tag matches the build version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(./gradlew -q properties | sed -n 's/^version: //p')
          echo "build version: $version, release tag: $TAG"
          case "$version" in *SNAPSHOT*) echo "::error::Refusing to publish a SNAPSHOT version"; exit 1 ;; esac
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match build version $version (expected v$version)"
            exit 1
          fi

      - name: Sign into a local repository first
        run: |
          ./gradlew publishToMavenLocal --stacktrace
          dir=~/.m2/repository/io/github/dan323/pitest-kotlin-plugin
          for ext in jar pom module; do
            find "$dir" -name "*.$ext.asc" | grep -q . || { echo "::error::No .$ext.asc signature was produced; check SIGNING_KEY"; exit 1; }
          done
          echo "Signatures produced:"; find "$dir" -name '*.asc' -exec basename {} \;

      - name: Upload to Maven Central
        if: github.event_name == 'release' || inputs.publish
        env:
          AUTO_RELEASE: ${{ vars.MAVEN_CENTRAL_AUTO_RELEASE }}
        run: |
          if [ "$AUTO_RELEASE" = "true" ]; then
            ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace
          else
            ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace
            echo "::notice::Uploaded. Review and click Publish at https://central.sonatype.com/publishing/deployments"
          fi
